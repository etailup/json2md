[project]
name = "json2md"
version = "0.1.0"
description = "Turn messy JSON into readable Markdown docs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "etailup" }]
keywords = ["json", "markdown", "cli", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.scripts]
json2md = "json2md.cli:main"

[project.urls]
Homepage = "https://github.com/etailup/json2md"
Repository = "https://github.com/etailup/json2md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/json2md"]
